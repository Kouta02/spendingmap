# SpendingMap — nginx do container frontend.
# Serve o SPA Angular e faz proxy reverso de /api, /admin e /static para o backend.
# TLS é terminado na borda (Cloudflare Tunnel); aqui o tráfego é HTTP simples.

# Honra o X-Forwarded-Proto que o Cloudflare Tunnel manda (https na borda);
# se não vier, cai no scheme local. Assim o Django reconhece a conexão como HTTPS.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS embutido do Docker — re-resolve "backend" em runtime. Sem isto, o nginx
    # fixa o IP do backend no boot e responde 502 permanente se o container backend
    # reiniciar e mudar de IP (autorrecuperação quebrada).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # gzip básico para os assets do build
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA — qualquer rota desconhecida cai no index.html (roteamento do Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Django (gunicorn). Variável + resolver = re-resolução em runtime.
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Admin do Django + estáticos do Django (servidos pelo whitenoise)
    location /admin/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    location /static/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
    }
}
